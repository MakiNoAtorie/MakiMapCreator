[package]
name = "mmc-app"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
eframe = "0.36"
fluent-bundle = "0.16.0"
mmc-core = { version = "0.1.0", path = "../core" }
mmc-render = { version = "0.1.0", path = "../render" }
rfd = "0.17.2"
unic-langid = "0.9.6"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_Pointer",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
