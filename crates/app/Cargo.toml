[package]
name = "mmc-app"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
eframe = "0.36"
fluent-bundle = "0.16.0"
log = "0.4"
mmc-core = { version = "0.1.0", path = "../core" }
mmc-kind-region = { version = "0.1.0", path = "../kind-region" }
mmc-kind-world = { version = "0.1.0", path = "../kind-world" }
mmc-render = { version = "0.1.0", path = "../render" }
mmc-store = { version = "0.1.0", path = "../store" }
rfd = "0.17.2"
serde_json = "1.0.154"
unic-langid = "0.9.6"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_Pointer",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3.27.0"
