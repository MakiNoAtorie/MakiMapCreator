# name = max milliseconds. The gate compares the median of several runs.
brush_stroke = 16
open_project = 1000
# Save start to file written; ADR-0014 gives no number, this is a regression cap.
save = 2000
# Overview read from the file, before the full open finishes.
open_first_frame = 1000
# Pan to an unloaded 1920x1080 area (40 tiles); stand-in from the loaded top level.
pan_stand_in = 16
pan_full_tiles = 100
full_rebuild = 1000
# 10 000 entities; ADR-0014 numbers.
name_lookup = 16
full_text_first_results = 50
# ADR-0014: the user keeps working during a save; median stroke while it runs = one frame.
save_edit_pause = 16
# ADR-0014 one frame: one 512 px stamp into an open stroke after the pen hovered there (tiles prefetched).
large_brush_stamp = 16
# ADR-0025 one frame: a 4-stamp part with detail run on the GPU copy until its frame is drawn.
# WARP at 384x216 (its upload costs about 85 ns a texel, its full-HD draw 20 ms); `_gpu` on a hardware adapter at 1920x1080.
stamp_to_visible = 16
stamp_to_visible_gpu = 16
# The same with the copy uploaded at pen down.
stroke_start_to_visible = 16
stroke_start_to_visible_gpu = 16
